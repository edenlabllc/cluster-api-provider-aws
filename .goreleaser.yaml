version: 2
builds:
# clusterctl-aws
- id: "clusterctl-aws"
  main: ./cmd/clusterawsadm
  binary: bin/clusterctl-aws
  env:
    - CGO_ENABLED=0
  ldflags:
  - -s -w 
  - -X 'sigs.k8s.io/cluster-api-provider-aws/v2/version.gitMajor={{.Major}}'
  - -X 'sigs.k8s.io/cluster-api-provider-aws/v2/version.gitMinor={{.Minor}}'
  - -X 'sigs.k8s.io/cluster-api-provider-aws/v2/version.gitVersion={{.Version}}'
  - -X 'sigs.k8s.io/cluster-api-provider-aws/v2/version.gitCommit={{.Commit}}'
  - -X 'sigs.k8s.io/cluster-api-provider-aws/v2/version.gitTreeState={{.GitTreeState}}'
  - -X 'sigs.k8s.io/cluster-api-provider-aws/v2/version.buildDate={{.Date}}'
  - -X 'sigs.k8s.io/cluster-api-provider-aws/v2/cmd/clusterawsadm/cmd/version.CLIName=clusterctl-aws'
  goos:
  - linux
  - darwin
  - windows 
  goarch:
  - amd64
  - arm64

# clusterawsadm
- id: "clusterawsadm"
  main: ./cmd/clusterawsadm
  binary: bin/clusterawsadm
  env:
    - CGO_ENABLED=0
  ldflags:
  - -s -w 
  - -X 'sigs.k8s.io/cluster-api-provider-aws/v2/version.gitMajor={{.Major}}'
  - -X 'sigs.k8s.io/cluster-api-provider-aws/v2/version.gitMinor={{.Minor}}'
  - -X 'sigs.k8s.io/cluster-api-provider-aws/v2/version.gitVersion={{.Version}}'
  - -X 'sigs.k8s.io/cluster-api-provider-aws/v2/version.gitCommit={{.Commit}}'
  - -X 'sigs.k8s.io/cluster-api-provider-aws/v2/version.gitTreeState={{.GitTreeState}}'
  - -X 'sigs.k8s.io/cluster-api-provider-aws/v2/version.buildDate={{.Date}}'
  goos:
  - linux
  - darwin
  - windows 
  goarch:
  - amd64
  - arm64

archives:
- id: clusterctl-aws
  ids:
  - clusterctl-aws
  name_template: "clusterctl-aws-{{ .Os }}-{{ .Arch }}"
  formats: ["binary"]
- id: clusterawsadm
  ids:
  - clusterawsadm
  name_template: "clusterawsadm-{{ .Os }}-{{ .Arch }}"
  formats: ["binary"]

release:
  # Do not open a GitHub Discussions thread for each release.
  # Upstream sets discussion_category_name: General; that fails (or is noisy) on
  # forks where Discussions are disabled or the category is missing.
  # discussion_category_name: General
  extra_files:
    - glob: ./templates/*.yaml
    - glob: ./out/*
  # Publish releases immediately from the build-push-image-public workflow.
  # Upstream uses draft: true (manual publish). draft: false matches our automated
  # tag + Goreleaser flow after merging release/vX.Y.Z into release-*.
  draft: false
